services:
  # ── Gateway (Go binary) ──────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "35432:5432"
    environment:
      PORT: "5432"
      CONTROL_PLANE_URL: "http://stub-api:3001"
      INTERNAL_GATEWAY_SECRET: "test-shared-secret"
    depends_on:
      stub-api:
        condition: service_started
      pgbouncer-test1-rw:
        condition: service_started
      pgbouncer-test1-ro:
        condition: service_started
      pgbouncer-test2-rw:
        condition: service_started
      pgbouncer-test2-ro:
        condition: service_started
      pgbouncer-test3-rw:
        condition: service_started
      pgbouncer-test3-ro:
        condition: service_started

  # ── Stub Control Plane API ─────────────────────────────────────
  stub-api:
    build:
      context: ./docker/stub-api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"

  # ── Tenant 1: PgBouncer RW ─────────────────────────────────────
  pgbouncer-test1-rw:
    image: edoburu/pgbouncer:latest
    ports:
      - "15432:5432"
    volumes:
      - ./docker/pgbouncer/pgbouncer-test1-rw.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres

  # ── Tenant 1: PgBouncer RO ─────────────────────────────────────
  pgbouncer-test1-ro:
    image: edoburu/pgbouncer:latest
    ports:
      - "15433:5432"
    volumes:
      - ./docker/pgbouncer/pgbouncer-test1-ro.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres

  # ── Tenant 2: PgBouncer RW ─────────────────────────────────────
  pgbouncer-test2-rw:
    image: edoburu/pgbouncer:latest
    ports:
      - "15434:5432"
    volumes:
      - ./docker/pgbouncer/pgbouncer-test2-rw.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres

  # ── Tenant 2: PgBouncer RO ─────────────────────────────────────
  pgbouncer-test2-ro:
    image: edoburu/pgbouncer:latest
    ports:
      - "15435:5432"
    volumes:
      - ./docker/pgbouncer/pgbouncer-test2-ro.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres

  # ── Tenant 3: PgBouncer RW ─────────────────────────────────────
  pgbouncer-test3-rw:
    image: edoburu/pgbouncer:latest
    ports:
      - "15436:5432"
    volumes:
      - ./docker/pgbouncer/pgbouncer-test3-rw.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres

  # ── Tenant 3: PgBouncer RO ─────────────────────────────────────
  pgbouncer-test3-ro:
    image: edoburu/pgbouncer:latest
    ports:
      - "15437:5432"
    volumes:
      - ./docker/pgbouncer/pgbouncer-test3-ro.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres

  # ── PostgreSQL Backend ──────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "25432:5432"
    volumes:
      - ./docker/init/init.sql:/docker-entrypoint-initdb.d/init.sql