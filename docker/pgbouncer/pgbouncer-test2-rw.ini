[databases]
app_test2 = host=postgres port=5432 dbname=app_test2 user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
server_lifetime = 300
server_idle_timeout = 60